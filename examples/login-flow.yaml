# A multi-step user flow: log in once per user, then browse.
name: login-and-browse

vars:
  baseUrl: http://localhost:8080

data:
  users: { csv: users.csv, mode: sequential }

setup: hooks.js#setup

options:
  timeout: 5s

scenarios:
  browse:
    executor: arrival-rate
    stages:
      - { duration: 5s, target: 50 }     # ramp up to 50 iterations/s
      - { duration: 10s, target: 200 }
      - { duration: 5s, target: 0 }
    flow:
      - http:
          name: login
          method: POST
          url: "{{ baseUrl }}/login"
          json: { id: "{{ users.id }}", pw: "{{ users.pw }}" }
          check: { status: 200, json: { "$.token": "tok-{{ users.id }}" } }
          extract: { token: $.token }
      - http:
          name: list
          url: "{{ baseUrl }}/items"
          headers: { Authorization: "Bearer {{ token }}" }
      - script: hooks.js#pickItem
      - http:
          name: item
          url: "{{ baseUrl }}/items/{{ itemId }}"
          headers: { Authorization: "Bearer {{ token }}" }
          check: { status: 200, json: { "$.id": "{{ itemId }}" } }

  # A second, closed-model workload running at the same time.
  steady:
    executor: constant-users
    users: 5
    duration: 20s
    flow:
      - http: { name: fast, url: "{{ baseUrl }}/fast" }
      - sleep: 50ms..150ms

thresholds:
  "latency{step:item}": ["p95 < 50ms", "p99 < 100ms"]
  "latency{scenario:browse}": ["p99 < 200ms"]
  errors: ["rate < 1%"]
  "iteration{scenario:browse}": ["p95 < 200ms"]
