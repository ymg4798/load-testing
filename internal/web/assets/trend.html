<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>{{.UplotCSS}}</style>
<style>{{.AppCSS}}</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><span class="logo">lt</span><span class="crumb">Trend  /  <b id="crumb"></b></span></div>
    <div class="bar-meta" id="meta"></div>
  </header>

  <section class="hero">
    <span id="status" class="status"><i></i><span>History</span></span>
    <h1 id="name">lt trend</h1>
    <p id="headline" class="headline"></p>
  </section>

  <section id="kpis" class="kpis" aria-label="Latest run"></section>

  <div class="main" style="grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)">
    <section class="panel">
      <div class="chart-h"><h3>Latency per run</h3><span class="unit">ms</span><div class="right"><div class="legend" id="lg-lat"></div></div></div>
      <div id="t-lat" class="chart"></div>
    </section>
    <section class="panel">
      <div class="chart-h"><h3>Throughput per run</h3><span class="unit">requests per second</span><div class="right"><div class="legend" id="lg-rps"></div></div></div>
      <div id="t-rps" class="chart"></div>
      <div class="chart-row">
        <div class="chart-h"><h3>Error rate per run</h3><span class="unit">%</span></div>
        <div id="t-err" class="chart"></div>
      </div>
    </section>
  </div>

  <div class="section-title"><h2>Runs</h2><p>Newest first · ★ marks the pinned baseline (lt history pin)</p></div>
  <div id="runs"></div>

  <footer class="foot"><span>Generated by lt</span><span>One point per stored run (lt run --save)</span></footer>
</div>
<script>{{.UplotJS}}</script>
<script>window.LT_DATA = {{.Data}};</script>
<script>{{.AppJS}}</script>
</body>
</html>
